services:
  ollama:
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]
    # NVIDIA GPU? install nvidia-container-toolkit and uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  ollama-pull:              # one-shot: downloads models, then exits
    image: ollama/ollama:latest
    depends_on: [ollama]
    environment: [OLLAMA_HOST=ollama:11434]
    entrypoint: ["sh", "-c", "sleep 3 && ollama pull ${OLLAMA_MODEL:-qwen3:8b} && ollama pull nomic-embed-text"]
    restart: "no"

  api:
    build: .
    env_file: .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./data:/app/data
      - ./workspace:/app/workspace
      - ./docs:/app/docs
    ports: ["8000:8000"]
    depends_on: [ollama]

  ui:
    build: .
    command: ["uv", "run", "streamlit", "run", "ui/app.py", "--server.address", "0.0.0.0", "--server.headless", "true"]
    environment:
      - API_URL=http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]

volumes:
  ollama:
