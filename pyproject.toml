[project]
name = "agentic-starter"
version = "0.1.0"
description = "Free, local-first LangGraph agent: tools, memory, human-in-the-loop, RAG, FastAPI + Streamlit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Agent orchestration
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core>=1.0",
    "langchain-text-splitters>=1.0",
    # Model providers (all have free options)
    "langchain-ollama>=1.0",          # local models, $0
    "langchain-google-genai>=3.0",    # Gemini free tier
    "langchain-openai>=1.0",          # any OpenAI-compatible API (Groq, OpenRouter, LM Studio...)
    # RAG
    "langchain-chroma>=1.0",
    "pypdf>=5.0",
    # Tools
    "ddgs>=9.0",                      # DuckDuckGo search, no API key
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    # Backend + UI
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "langgraph-cli[inmem]>=0.3",      # `langgraph dev` -> free local LangGraph Studio
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent", "src/api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
